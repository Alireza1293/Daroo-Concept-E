    <!-- USA Tag -->
    <rect x="52" y="36" width="30" height="11" rx="2" fill="#1e40af"/>
    <text x="67" y="44.5" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="800" font-size="6.5" fill="#ffffff" text-anchor="middle">USA</text>
    <text x="88" y="45" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="700" font-size="7" fill="#64748b" letter-spacing="0.8">LAB ESSENTIALS</text>
