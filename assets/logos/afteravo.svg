      <rect x="3" y="3" width="28" height="28" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <!-- Stylized A with Leaf -->
      <path d="M17 8 L24 24 L20 24 L18.5 20 L15.5 20 L14 24 L10 24 Z" fill="#1e40af"/>
