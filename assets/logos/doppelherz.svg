<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" fill="none">
    <!-- Double Interlocking Red Hearts -->
    <g transform="translate(10, 11)">
      <!-- Left / Back Heart -->
      <path d="M15 6 C11 1, 3 3, 3 11 C3 18, 12 24, 15 28 C18 24, 27 18, 27 11 C27 3, 19 1, 15 6 Z" fill="#dc2626"/>
      <!-- Right / Front Overlapping Heart -->
      <path d="M25 11 C22 7, 16 8, 16 14 C16 20, 23 25, 25 28 C27 25, 34 20, 34 14 C34 8, 28 7, 25 11 Z" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
      <!-- Inner highlights -->
      <circle cx="9" cy="9" r="1.5" fill="#fca5a5"/>
    </g>
    <!-- Doppelherz Wordmark -->
    <text x="52" y="31" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-size="19" fill="#0f172a">
      <tspan font-weight="900">Doppel</tspan><tspan font-weight="500">herz</tspan>
    </text>
    <!-- aktiv capsule badge -->
    <rect x="52" y="37" width="36" height="12" rx="6" fill="#dc2626"/>
    <text x="70" y="46" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="800" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">aktiv</text>
    <text x="94" y="46" font-family="-apple-system, BlinkMacSystemFont, Arial, sans-serif" font-weight="600" font-size="7" fill="#64748b">QUEISSER PHARMA</text>
  </svg>