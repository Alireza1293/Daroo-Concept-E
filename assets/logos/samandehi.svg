<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none">
  <!-- Background Card -->
  <rect width="200" height="240" rx="16" fill="#ffffff"/>
  <rect x="1" y="1" width="198" height="238" rx="15" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Outer Shield Badge -->
  <g transform="translate(45, 25)">
    <!-- Golden Geometric Medallion -->
    <path d="M55 5 L95 28 L95 85 C95 118 55 138 55 138 C55 138 15 118 15 85 L15 28 Z" fill="#0f172a" stroke="#d97706" stroke-width="3"/>
    <path d="M55 13 L87 32 L87 83 C87 110 55 127 55 127 C55 127 23 110 23 83 L23 32 Z" fill="#1e293b"/>
    
    <!-- Samandehi Calligraphic Stylized Logo Monogram -->
    <g transform="translate(32, 38)" fill="#f59e0b">
      <!-- Crest geometry -->
      <path d="M23 0 L32 15 L28 15 L23 7 L18 15 L14 15 Z"/>
      <circle cx="23" cy="20" r="4" fill="#fbbf24"/>
      <path d="M12 28 C12 28 8 36 8 46 C8 58 18 64 23 64 C28 64 38 58 38 46 C38 36 34 28 34 28 L30 32 C30 32 33 38 33 45 C33 52 28 58 23 58 C18 58 13 52 13 45 C13 38 16 32 16 32 Z" fill="#f59e0b"/>
      <path d="M20 34 L26 34 L26 48 L20 48 Z" fill="#fbbf24"/>
      <circle cx="23" cy="52" r="2.5" fill="#fef3c7"/>
    </g>
    
    <!-- 12-pointed accent stars -->
    <circle cx="55" cy="112" r="3" fill="#fbbf24"/>
    <circle cx="43" cy="107" r="2" fill="#d97706"/>
    <circle cx="67" cy="107" r="2" fill="#d97706"/>
  </g>

  <!-- Typography -->
  <text x="100" y="192" font-family="'Vazirmatn', Tahoma, Arial, sans-serif" font-weight="800" font-size="12" fill="#0f172a" text-anchor="middle">نشان ملی ثبت رسانه</text>
  <text x="100" y="208" font-family="'Vazirmatn', Tahoma, Arial, sans-serif" font-weight="700" font-size="11" fill="#b45309" text-anchor="middle">ساماندهی پایگاه‌های اینترنتی</text>
  <text x="100" y="224" font-family="'Vazirmatn', Tahoma, Arial, sans-serif" font-weight="500" font-size="9" fill="#64748b" text-anchor="middle">وزارت فرهنگ و ارشاد اسلامی</text>
</svg>
